<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NYAWIT - Register</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
  <style> body { font-family: 'Quicksand', sans-serif; } </style>
  <script>
    tailwind.config = { theme: { extend: { colors: { cream: '#FDFBF7', nyawitGreen: '#2E8B57', nyawitOrange: '#F97316' } } } }
  </script>
</head>
<body class="bg-cream h-screen flex justify-center items-center relative">
  <div class="bg-white p-8 rounded-lg shadow-xl w-full max-w-md border-t-4 border-nyawitOrange">
    <h1 class="text-3xl font-bold text-nyawitGreen text-center mb-6">Daftar NYAWIT</h1>
    <form id="registerForm" action="dashboard.html">
      <div class="mb-3"><input type="text" id="username" placeholder="Username" class="w-full p-2 border rounded focus:outline-none focus:ring-2 focus:ring-nyawitOrange"></div>
      <div class="mb-3"><input type="password" id="password" placeholder="Password" class="w-full p-2 border rounded focus:outline-none focus:ring-2 focus:ring-nyawitOrange"></div>
      <div class="mb-3"><input type="text" id="nama" placeholder="Nama Lengkap" class="w-full p-2 border rounded focus:outline-none focus:ring-2 focus:ring-nyawitOrange"></div>
      <div class="mb-3"><input type="date" id="tgl_lahir" class="w-full p-2 border rounded focus:outline-none focus:ring-2 focus:ring-nyawitOrange text-gray-500"></div>
      <div class="mb-3"><textarea id="alamat" placeholder="Alamat" rows="2" class="w-full p-2 border rounded focus:outline-none focus:ring-2 focus:ring-nyawitOrange"></textarea></div>
      <div class="mb-6"><input type="number" id="telepon" placeholder="No Telp (+62)" class="w-full p-2 border rounded focus:outline-none focus:ring-2 focus:ring-nyawitOrange"></div>
      <button type="submit" class="w-full bg-nyawitGreen text-white font-bold py-2 px-4 rounded hover:bg-yellow-600 transition duration-300">Register</button>
    </form>
  </div>

  <div id="errorModal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex justify-center items-center z-50">
    <div class="bg-white w-11/12 max-w-md rounded-lg shadow-2xl overflow-hidden border-t-4 border-red-500">
      <div class="bg-cream p-4 border-b flex justify-between items-center">
        <h2 class="text-xl font-bold text-red-600 flex items-center">
          <svg class="w-6 h-6 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
          Aduh Gk sesuai Persyaratannya :(
        </h2>
      </div>
      <div class="p-6">
        <p class="text-gray-700 font-semibold mb-3">Mohon perbaiki data berikut:</p>
        <ul id="errorList" class="list-disc pl-5 text-gray-600 text-sm space-y-1"></ul>
      </div>
      <div class="bg-gray-50 p-4 text-right">
        <button id="closeModalBtn" class="bg-nyawitOrange text-white font-bold py-2 px-6 rounded hover:bg-yellow-600 transition">Mengerti</button>
      </div>
    </div>
  </div>

  <script src="validasi_input.js"></script>
</body>
</html>
