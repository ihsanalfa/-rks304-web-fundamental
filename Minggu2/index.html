<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NYAWIT - Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
  <style> body { font-family: 'Quicksand', sans-serif; } </style>
  <script>
    tailwind.config = { theme: { extend: { colors: { cream: '#FDFBF7', nyawitGreen: '#2E8B57' } } } }
  </script>
</head>
<body class="bg-cream h-screen flex justify-center items-center">
  <div class="bg-white p-8 rounded-lg shadow-xl w-96 border-t-4 border-nyawitGreen">
    <h1 class="text-4xl font-bold text-nyawitGreen text-center mb-6">NYAWIT</h1>
    <p class="text-center text-gray-500 mb-6">Silakan login ke akun Anda</p>
    <form action="dashboard.html">
      <div class="mb-4">
        <label class="block text-gray-700 text-sm font-bold mb-2">Username</label>
        <input type="text" class="w-full p-2 border rounded focus:outline-none focus:ring-2 focus:ring-nyawitGreen" required>
      </div>
      <div class="mb-6">
        <label class="block text-gray-700 text-sm font-bold mb-2">Password</label>
        <input type="password" class="w-full p-2 border rounded focus:outline-none focus:ring-2 focus:ring-nyawitGreen" required>
      </div>
      <button type="submit" class="w-full bg-nyawitGreen text-white font-bold py-2 px-4 rounded hover:bg-green-700 transition">
        Login
      </button>
    </form>
  </div>
</body>
</html>
