<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NYAWIT - Edit Produk</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
  <style> body { font-family: 'Quicksand', sans-serif; } </style>
  <script> tailwind.config = { theme: { extend: { colors: { cream: '#FDFBF7', nyawitGreen: '#2E8B57' } } } } </script>
</head>
<body class="bg-cream text-gray-800 flex flex-col min-h-screen">
  <header class="bg-nyawitGreen text-white p-4 shadow-md flex justify-between items-center">
    <h1 class="text-2xl font-bold">NYAWIT Admin</h1>
    <a href="index.html" class="bg-orange-400 hover:bg-red-600 px-4 py-2 rounded text-sm font-bold">Logout</a>
  </header>
  <div class="flex flex-1">
    <nav class="w-64 bg-white shadow-lg p-4 flex flex-col gap-2 font-semibold border-r">
      <a href="dashboard.html" class="p-2 hover:bg-yellow-600 hover:text-white rounded">Dashboard</a>
      <a href="products.html" class="p-2 bg-nyawitGreen text-white rounded">Products</a>
      <a href="#" class="p-2 hover:bg-yellow-600 hover:text-white rounded">Users</a>
      <a href="#" class="p-2 hover:bg-yellow-600 hover:text-white rounded">Setting</a>
    </nav>
    <main class="flex-1 p-8">
      <h2 class="text-3xl font-bold text-nyawitGreen mb-6">Edit Produk</h2>
      <form action="products.html" class="bg-white p-6 shadow-md rounded-lg max-w-xl border-t-4 border-nyawitGreen">
        <div class="mb-4">
          <label class="block text-gray-700 font-bold mb-2">Name</label>
          <input type="text" value="Pohon Sawit Second Jodoh" class="w-full p-2 border rounded focus:ring-2 focus:ring-nyawitGreen focus:outline-none">
        </div>
        <div class="mb-4">
          <label class="block text-gray-700 font-bold mb-2">Stock</label>
          <input type="number" value="19" class="w-full p-2 border rounded focus:ring-2 focus:ring-nyawitGreen focus:outline-none">
        </div>
        <div class="mb-6">
          <label class="block text-gray-700 font-bold mb-2">Description</label>
          <textarea class="w-full p-2 border rounded focus:ring-2 focus:ring-nyawitGreen focus:outline-none" rows="4">Pohon Sawit dengan kualitas yang sangat bagus dan mampu menghasilkan minyak goreng hingga waktu tak menentu</textarea>
        </div>
        <button type="submit" class="bg-nyawitGreen text-white px-6 py-2 rounded font-bold hover:bg-yellow-600 shadow">Submit</button>
      </form>
    </main>
  </div>
  <footer class="bg-nyawitGreen text-white text-center p-3 mt-auto">
    <p>&copy; 2026 NYAWIT - Ihsan Alfareno.</p>
  </footer>
</body>
</html>
